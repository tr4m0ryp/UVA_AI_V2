name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libcurl4-openssl-dev libjson-c-dev libssl-dev
      - name: Build (dynamic)
        run: make
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uva-proxy-linux-x86_64
          path: uva-proxy

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install curl json-c openssl@3
      - name: Build
        run: make
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uva-proxy-macos-arm64
          path: uva-proxy

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-json-c
            mingw-w64-x86_64-openssl
            make
            findutils
      - name: Build
        run: make
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uva-proxy-windows-x86_64
          path: uva-proxy.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release files
        run: |
          mv artifacts/uva-proxy-linux-x86_64/uva-proxy uva-proxy-linux-x86_64
          mv artifacts/uva-proxy-macos-arm64/uva-proxy uva-proxy-macos-arm64
          mv artifacts/uva-proxy-windows-x86_64/uva-proxy.exe uva-proxy-windows-x86_64.exe
          chmod +x uva-proxy-linux-x86_64 uva-proxy-macos-arm64
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uva-proxy-linux-x86_64
            uva-proxy-macos-arm64
            uva-proxy-windows-x86_64.exe
          generate_release_notes: true
