<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>UvA Session Sync</h1>

    <label for="proxyUrl">Proxy URL</label>
    <input type="url" id="proxyUrl" placeholder="http://localhost:3000">

    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="uva-...">

    <div class="actions">
      <button id="saveBtn">Save</button>
      <button id="syncBtn">Sync Now</button>
    </div>

    <div id="status" class="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
